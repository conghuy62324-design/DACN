log_format frontend_request '$request_method $status $request_time $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log frontend_request;
    error_log /var/log/nginx/error.log crit;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
