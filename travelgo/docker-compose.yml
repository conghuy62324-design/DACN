version: '3.9'

services:
  # ─────────────────────────────────────────────
  # PostgreSQL 15 + PostGIS 3.4
  # ─────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: travelgo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travelgo2026}
      POSTGRES_DB: ${DB_NAME:-travelgo_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migration được quản lý bởi Node.js script (npm run db:migrate:apply)
      # KHÔNG mount vào docker-entrypoint-initdb.d để tránh conflict với schema_migrations tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-travelgo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - travelgo_net

  # ─────────────────────────────────────────────
  # pgAdmin 4 – Giao diện quản trị Database
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: travelgo_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hugotravel.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travelgo_net

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  travelgo_net:
    driver: bridge
